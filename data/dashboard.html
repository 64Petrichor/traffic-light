<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Traffic Light Dashboard</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>

    <div class="main-wrapper">
        <div class="panel">
            <div class="panel-title">System Status</div>
            <div class="status-grid">
                <div class="status-box"><span class="val" id="ui-phase">--</span><small>PHASE</small></div>
                <div class="status-box"><span class="val" id="ui-timer">0s</span><small>REMAINING</small></div>
            </div>
        </div>

        <div class="ldr-card">
            <h2>&#x1F506; Brightness <span id="night-badge" class="dim-badge" style="display:none">NIGHT MODE</span></h2>
            <div class="ldr-row">
                <div class="ldr-value" id="ldr-value">--%</div>
                <div class="ldr-bar-wrap">
                    <div class="ldr-bar" id="ldr-bar" style="width:0%;background:#00ff66"></div>
                </div>
            </div>
            <div class="ldr-label">GPIO 34 | Threshold: <b id="ldr-threshold">--%</b> | Auto-dim: <b id="autodim-state">--</b></div>
            <button class="btn-dim" onclick="toggleDim()" id="dim-btn">-- Auto-Dim</button>
        </div>

        <div class="intersection">
            <div class="road v" id="top-road">
                <div class="light red"></div><div class="light yellow"></div><div class="light green"></div>
            </div>
            <div class="mid-section">
                <div class="road" id="left-road">
                    <div class="light red"></div><div class="light yellow"></div><div class="light green"></div>
                </div>
                <div class="center-hub"></div>
                <div class="road" id="right-road">
                    <div class="light red"></div><div class="light yellow"></div><div class="light green"></div>
                </div>
            </div>
            <div class="road v" id="bottom-road">
                <div class="light red"></div><div class="light yellow"></div><div class="light green"></div>
            </div>
        </div>

        <div class="panel">
            <div class="panel-title">Manual Green Override</div>
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
                <button onclick="override('top')">TOP</button>
                <button onclick="override('bottom')">BOTTOM</button>
                <button onclick="override('left')">LEFT</button>
                <button onclick="override('right')">RIGHT</button>
            </div>
            <button class="btn-clear" onclick="clearOverride()">RESTORE AUTO CYCLE</button>
        </div>

        <div class="panel">
            <div class="panel-title">Phase Duration (ms)</div>
            <div class="input-group"><span>Green Duration (All):</span> <input type="number" id="in-green" value="5000"></div>
            <div class="input-group"><span>Yellow Duration:</span> <input type="number" id="in-yellow" value="2000"></div>
            <button style="background: linear-gradient(135deg, #1a4a8a, #00e1ff); color: white; border:none;" onclick="applySettings()">UPDATE ALL TIMINGS</button>
        </div>
    </div>

    <pre id="debug" style="display:none"></pre>

    <script src="/script.js"></script>
</body>
</html>
